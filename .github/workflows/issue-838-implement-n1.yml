name: Issue 838 N-1 implementation

on:
  push:
    branches: [issue-838-exact-numeric-gate]

permissions:
  contents: write

jobs:
  implement:
    if: >-
      github.event.head_commit.message == 'chore(numeric): run N-1 implementation issue #838'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-838-exact-numeric-gate
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - name: Apply approved N-1 implementation
        shell: bash
        run: |
          cat > /tmp/issue838_n1.py <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              n = text.count(old)
              if count is not None and n != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {n}: {old!r}')
              if n == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              p.write_text(text.replace(old, new))

          Path('src/genia/numeric_literals.py').write_text('''from __future__ import annotations

from dataclasses import dataclass
from decimal import Decimal
from typing import Any


@dataclass(frozen=True)
class NumericLiteral:
    kind: str
    digits: str | None = None
    coefficient: str | None = None
    exponent: str | None = None

    def portable_payload(self) -> dict[str, str]:
        if self.kind == "integer":
            if self.digits is None:
                raise ValueError("integer numeric literal is missing digits")
            return {"kind": "integer", "digits": self.digits}
        if self.kind == "decimal":
            if self.coefficient is None or self.exponent is None:
                raise ValueError("decimal numeric literal is incomplete")
            return {
                "kind": "decimal",
                "coefficient": self.coefficient,
                "exponent": self.exponent,
            }
        raise ValueError(f"unsupported numeric literal kind {self.kind!r}")


def _canonical_signed_integer_text(value: int) -> str:
    return str(value)


def parse_numeric_literal(text: str) -> NumericLiteral:
    # Source signs are parser unary operators and therefore never arrive here.
    lower = text.lower()
    has_exp = "e" in lower
    if has_exp:
        significand, exp_text = lower.split("e", 1)
        source_exp = int(exp_text)
    else:
        significand = text
        source_exp = 0

    if "." not in significand and not has_exp:
        digits = significand.lstrip("0") or "0"
        return NumericLiteral("integer", digits=digits)

    if "." in significand:
        whole, frac = significand.split(".", 1)
    else:
        whole, frac = significand, ""
    coeff_digits = (whole + frac).lstrip("0") or "0"
    exponent = source_exp - len(frac)
    if coeff_digits == "0":
        return NumericLiteral("decimal", coefficient="0", exponent="0")
    while coeff_digits.endswith("0"):
        coeff_digits = coeff_digits[:-1]
        exponent += 1
    return NumericLiteral(
        "decimal",
        coefficient=coeff_digits,
        exponent=_canonical_signed_integer_text(exponent),
    )


def is_portable_numeric_payload(value: Any) -> bool:
    if not isinstance(value, dict):
        return False
    kind = value.get("kind")
    if kind == "integer":
        return set(value) == {"kind", "digits"} and isinstance(value.get("digits"), str)
    if kind == "decimal":
        return (
            set(value) == {"kind", "coefficient", "exponent"}
            and isinstance(value.get("coefficient"), str)
            and isinstance(value.get("exponent"), str)
        )
    return False


def materialize_legacy_numeric(value: Any) -> Any:
    """Temporary N-1 compatibility bridge behind portable Core IR.

    N-1 changes source classification and portable representation only. The
    following runtime slice replaces this bridge with exact runtime values.
    """
    if isinstance(value, NumericLiteral):
        value = value.portable_payload()
    if not is_portable_numeric_payload(value):
        return value
    if value["kind"] == "integer":
        return int(value["digits"])
    coefficient = int(value["coefficient"])
    exponent = int(value["exponent"])
    exact_decimal = Decimal(coefficient).scaleb(exponent)
    return float(exact_decimal)
''')

          # Lexer: accepted exponent forms plus owned malformed-exponent diagnostic.
          replace('src/genia/lexer.py', '("NUMBER", r"\\d+(?:\\.\\d+)?"),', '("NUMBER", r"\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?"),', 1)
          replace('src/genia/lexer.py', 'NUMBER_RE = re.compile(r"\\d+(?:\\.\\d+)?")', 'NUMBER_RE = re.compile(r"\\d+(?:\\.\\d+)?(?:[eE][+-]?\\d+)?")', 1)
          replace(
              'src/genia/lexer.py',
              '''        if number_match is not None:\n            text = number_match.group()\n            tokens.append(Token("NUMBER", text, pos))\n            pos += len(text)\n            continue\n''',
              '''        if number_match is not None:\n            text = number_match.group()\n            end = pos + len(text)\n            if end < length and source[end] in "eE":\n                raise SyntaxError(f"Invalid numeric exponent at {end}")\n            tokens.append(Token("NUMBER", text, pos))\n            pos = end\n            continue\n''',
              1,
          )

          # AST semantic literal descriptor.
          replace('src/genia/ast_nodes.py', 'from typing import Any, Optional\n', 'from typing import Any, Optional\n\nfrom .numeric_literals import NumericLiteral\n', 1)
          replace('src/genia/ast_nodes.py', '    value: int | float\n', '    value: NumericLiteral\n', 1)

          # Parser: one lexical helper for all NUMBER positions.
          replace('src/genia/parser.py', 'from .lexer import Token, SourceSpan, parse_string_literal, parse_glob_literal\n', 'from .lexer import Token, SourceSpan, parse_string_literal, parse_glob_literal\nfrom .numeric_literals import parse_numeric_literal\n', 1)
          replace(
              'src/genia/parser.py',
              'Number(float(tok.text) if "." in tok.text else int(tok.text), span=self.span_for_tokens(tok, tok))',
              'Number(parse_numeric_literal(tok.text), span=self.span_for_tokens(tok, tok))',
              3,
          )

          # Lowering: actual portable Core IR carries tagged semantic payloads.
          replace('src/genia/lowering.py', 'return IrLiteral(node.value, span=node.span)', 'return IrLiteral(node.value.portable_payload(), span=node.span)', 1)
          replace('src/genia/lowering.py', 'return IrPatLiteral(pattern.value)', 'return IrPatLiteral(pattern.value.portable_payload())', 1)

          # Parse adapter: expose numeric semantic payload and unary structure.
          replace(
              'hosts/python/parse_adapter.py',
              "return {'kind': 'Literal', 'value': getattr(node, 'value', None)}",
              "return {'kind': 'Literal', 'value': getattr(node, 'value').portable_payload()}",
              1,
          )
          marker = "    if node_type == 'Var':\n"
          insertion = "    if node_type == 'Unary':\n        return {'kind': 'Unary', 'op': getattr(node, 'op', None), 'expr': normalize_ast(getattr(node, 'expr', None))}\n"
          replace('hosts/python/parse_adapter.py', marker, insertion + marker, 1)

          # Quoted syntax normalizer must not leak the AST support object.
          replace(
              'hosts/python/ir_normalize.py',
              'return {"kind": "Literal", "value": expr.value}\n    if isinstance(expr, Boolean):',
              'return {"kind": "Literal", "value": expr.value.portable_payload()}\n    if isinstance(expr, Boolean):',
              1,
          )

          # Runtime compatibility is deliberately behind Core IR for N-1 only.
          # This does not define exact runtime behavior; N-2 replaces it.
          for branch_import in [
              '    from genia.utf8 import format_debug, format_display\n',
              '    from .utf8 import format_debug, format_display\n',
          ]:
              prefix = '    from genia.numeric_literals import materialize_legacy_numeric\n' if 'genia.utf8' in branch_import else '    from .numeric_literals import materialize_legacy_numeric\n'
              replace('src/genia/evaluator.py', branch_import, branch_import + prefix, 1)
          replace('src/genia/evaluator.py', '        if isinstance(node, IrLiteral):\n            return node.value\n', '        if isinstance(node, IrLiteral):\n            return materialize_legacy_numeric(node.value)\n', 1)
          replace('src/genia/evaluator.py', '    if isinstance(node, Number):\n        return node.value\n', '    if isinstance(node, Number):\n        return materialize_legacy_numeric(node.value)\n', 1)
          replace('src/genia/evaluator.py', '    if isinstance(pattern, Number):\n        return pattern.value\n', '    if isinstance(pattern, Number):\n        return materialize_legacy_numeric(pattern.value)\n', 1)

          # Pattern matching consumes the same portable literal payload while
          # runtime values remain legacy until N-2.
          p = Path('src/genia/pattern_match.py')
          text = p.read_text()
          if 'numeric_literals import materialize_legacy_numeric' not in text:
              if 'from .equality import genia_equal' in text:
                  text = text.replace('from .equality import genia_equal', 'from .equality import genia_equal\nfrom .numeric_literals import materialize_legacy_numeric')
              elif 'from genia.equality import genia_equal' in text:
                  text = text.replace('from genia.equality import genia_equal', 'from genia.equality import genia_equal\nfrom genia.numeric_literals import materialize_legacy_numeric')
              else:
                  raise SystemExit('pattern_match.py equality import not found')
          old = 'if isinstance(pattern, IrPatLiteral):\n        return {} if genia_equal(pattern.value, arg) else None'
          if old not in text:
              raise SystemExit('pattern_match literal branch not found')
          text = text.replace(old, 'if isinstance(pattern, IrPatLiteral):\n        expected = materialize_legacy_numeric(pattern.value)\n        return {} if genia_equal(expected, arg) else None')
          p.write_text(text)
          PY
          uv run python /tmp/issue838_n1.py
      - name: Targeted shared evidence
        run: |
          uv run python -m tools.spec_runner --category parse --name-prefix exact-numeric-
          uv run python -m tools.spec_runner --category ir --name-prefix exact-numeric-
      - name: Focused regressions
        run: |
          uv run pytest -q tests/spec/test_shared_parse.py tests/spec/test_shared_ir.py tests/unit/test_ir.py tests/unit/test_parser.py --maxfail=1
      - name: Commit N-1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/genia hosts/python
          git commit -m 'feat(numeric): implement exact literal and Core IR slice issue #838'
          git push origin HEAD:issue-838-exact-numeric-gate
