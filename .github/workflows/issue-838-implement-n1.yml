name: Issue 838 N-1 implementation

on:
  push:
    branches: [issue-838-exact-numeric-gate]

permissions:
  contents: write

jobs:
  implement:
    if: >-
      github.event.head_commit.message == 'chore(numeric): run N-1 implementation issue #838'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: issue-838-exact-numeric-gate
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --dev
      - name: Apply approved N-1 implementation
        run: |
          uv run python tools/issue838_n1_apply_fix.py
          uv run python tools/issue838_n1_apply_fix2.py
          uv run python tools/issue838_n1_apply.py
      - name: Targeted shared evidence
        run: |
          uv run python -m tools.spec_runner --category parse --name-prefix exact-numeric-
          uv run python -m tools.spec_runner --category ir --name-prefix exact-numeric-
      - name: Focused regressions
        run: |
          uv run pytest -q tests/spec/test_shared_parse.py tests/spec/test_shared_ir.py tests/unit/test_ir.py tests/unit/test_parser.py --maxfail=1
      - name: Commit N-1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/genia hosts/python
          git commit -m 'feat(numeric): implement exact literal and Core IR slice issue #838'
          git push origin HEAD:issue-838-exact-numeric-gate
