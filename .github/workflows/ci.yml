name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Fork PRs intentionally skip CI until reviewed and run from a trusted branch/manual dispatch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Docs coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
      - run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Check function reference is current
        run: python -m uv run --python "$UV_PYTHON" python tools/gen_function_docs.py --check
      - name: Doc coverage + style lint
        run: python -m uv run --python "$UV_PYTHON" python tools/lint_doc.py --scan-dir src/genia/std/prelude --require-coverage

  cheatsheet:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Cheatsheet validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
      - run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Run cheatsheet tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q tests/unit/test_cheatsheet_*.py

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Fast tests (py3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv for Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m uv --version
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Lint (ruff)
        run: python -m uv run --python "$UV_PYTHON" ruff check .
      - name: Run non-slow, non-loopback tests with coverage
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv --maxfail=1 --cov=genia --cov-report=term-missing -m "not slow and not loopback" -n auto
      - name: Run non-slow loopback tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv --maxfail=1 --cov=genia --cov-append --cov-report=term-missing -m "not slow and loopback" -n auto
      - name: Run semantic specs
        run: python -m uv run --python "$UV_PYTHON" python -m tools.spec_runner

  extension:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: VS Code extension (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode/genia-debugger
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/genia-debugger/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test extension
        run: npm test

  mcp-client-acceptance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: MCP stdio client acceptance (official SDK)
    runs-on: ubuntu-latest
    env:
      GENIA_REQUIRE_MCP_CLIENT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/mcp_acceptance/package-lock.json
      - name: Install the locked MCP client
        working-directory: tools/mcp_acceptance
        run: npm ci
      - name: Run the stdio configuration, launch, lifecycle, and official-client tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv -n0 tests/unit/test_r28_mcp_stdio_config.py tests/unit/test_r28_mcp_stdio_launch.py tests/unit/test_r28_mcp_stdio_lifecycle.py tests/unit/test_r28_mcp_official_client.py
