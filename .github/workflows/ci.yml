name: CI

on:
  push:
    branches:
      - main
      - master
      - infra/self-hosted-ci
  pull_request:
  workflow_dispatch:

# September 2026 temporary policy: no GitHub-hosted runner compute.
# Fork PRs intentionally skip CI until reviewed and run from a trusted branch/manual dispatch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Docs coverage
    runs-on: [self-hosted, linux, x64, genia]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
      - run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Check function reference is current
        run: python -m uv run --python "$UV_PYTHON" python tools/gen_function_docs.py --check
      - name: Doc coverage + style lint
        run: python -m uv run --python "$UV_PYTHON" python tools/lint_doc.py --scan-dir src/genia/std/prelude --require-coverage

  cheatsheet:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Cheatsheet validation
    runs-on: [self-hosted, linux, x64, genia]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
      - run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Run cheatsheet tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q tests/unit/test_cheatsheet_*.py

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Fast tests (py3.14)
    runs-on: [self-hosted, linux, x64, genia]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv for Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m uv --version
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Lint (ruff)
        run: python -m uv run --python "$UV_PYTHON" ruff check .
      - name: Run non-slow, non-loopback tests with coverage
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv --maxfail=1 --cov=genia --cov-report=term-missing -m "not slow and not loopback" -n auto
      - name: Run non-slow loopback tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv --maxfail=1 --cov=genia --cov-append --cov-report=term-missing -m "not slow and loopback" -n auto
      - name: Run semantic specs
        run: python -m uv run --python "$UV_PYTHON" python -m tools.spec_runner

  host-parity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Python/C++ host parity
    runs-on: [self-hosted, linux, x64, genia]
    timeout-minutes: 30
    steps:
      - name: Check out semantic authority
        uses: actions/checkout@v6
        with:
          path: genia-2026
          fetch-depth: 0
      - name: Check out C++ host
        uses: actions/checkout@v6
        with:
          repository: m0smith/genia-cpp
          path: genia-cpp
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap Python environment
        working-directory: genia-2026
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          python -m uv sync --dev --python "$(command -v python)"
      - name: Build C++ adapter
        working-directory: genia-cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
      - name: Run shared specs against Python
        continue-on-error: true
        working-directory: genia-2026
        run: >-
          python -m uv run --python "$(command -v python)" python -m tools.spec_runner
          --host 'python -m hosts.python.protocol_adapter'
          --evidence "$RUNNER_TEMP/python-conformance.json"
      - name: Run shared specs against C++
        continue-on-error: true
        working-directory: genia-2026
        run: >-
          python -m uv run --python "$(command -v python)" python -m tools.spec_runner
          --host "$GITHUB_WORKSPACE/genia-cpp/build/genia-adapter"
          --evidence "$RUNNER_TEMP/cpp-conformance.json"
      - name: Enforce and report parity
        if: always()
        working-directory: genia-2026
        run: >-
          python tools/check_host_parity.py
          --python-evidence "$RUNNER_TEMP/python-conformance.json"
          --cpp-evidence "$RUNNER_TEMP/cpp-conformance.json"

  extension:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: VS Code extension (Node)
    runs-on: [self-hosted, linux, x64, genia]
    defaults:
      run:
        working-directory: vscode/genia-debugger
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode/genia-debugger/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and test extension
        run: npm test
