name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync dependencies
        run: uv sync --dev

      - name: Stage docs for MkDocs
        run: uv run python tools/stage_docs_for_mkdocs.py

      - name: Validate docs and semantic sync
        run: uv run pytest -q tests/doc/test_semantic_doc_sync.py tests/unit/test_doc_style_sync.py tests/unit/test_cheatsheet_*.py

      - name: Check function reference is current
        run: uv run python tools/gen_function_docs.py --check

      - name: Doc coverage + style lint
        run: uv run python tools/lint_doc.py --scan-dir src/genia/std/prelude --require-coverage

      - name: Build docs
        run: uv run mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for wiki publish
        if: ${{ secrets.WIKI_TOKEN != '' }}
        uses: actions/checkout@v6

      - name: Set up Python for wiki publish
        if: ${{ secrets.WIKI_TOKEN != '' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv for wiki publish
        if: ${{ secrets.WIKI_TOKEN != '' }}
        uses: astral-sh/setup-uv@v7

      - name: Sync dependencies for wiki publish
        if: ${{ secrets.WIKI_TOKEN != '' }}
        run: uv sync --dev

      - name: Publish function reference to GitHub Wiki
        if: ${{ secrets.WIKI_TOKEN != '' }}
        env:
          WIKI_REMOTE: https://x-access-token:${{ secrets.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: uv run tools/publish_wiki.sh
