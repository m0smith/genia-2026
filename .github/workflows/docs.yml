name: Docs

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# September 2026 temporary policy: no GitHub-hosted runner compute.
# Fork PRs intentionally skip docs CI until reviewed and run from a trusted branch.
concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, genia]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"

      - name: Stage docs for MkDocs
        run: python -m uv run --python "$UV_PYTHON" python tools/stage_docs_for_mkdocs.py

      - name: Validate docs and semantic sync
        run: python -m uv run --python "$UV_PYTHON" pytest -q tests/doc/test_semantic_doc_sync.py tests/unit/test_doc_style_sync.py tests/unit/test_cheatsheet_*.py

      - name: Check function reference is current
        run: python -m uv run --python "$UV_PYTHON" python tools/gen_function_docs.py --check

      - name: Doc coverage + style lint
        run: python -m uv run --python "$UV_PYTHON" python tools/lint_doc.py --scan-dir src/genia/std/prelude --require-coverage

      - name: Build docs
        run: python -m uv run --python "$UV_PYTHON" mkdocs build --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, linux, x64, genia]
    env:
      WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Check out repository for wiki publish
        if: env.WIKI_TOKEN != ''
        uses: actions/checkout@v6

      - name: Set up Python for wiki publish
        if: env.WIKI_TOKEN != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Bootstrap uv for wiki publish
        if: env.WIKI_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"

      - name: Sync dependencies for wiki publish
        if: env.WIKI_TOKEN != ''
        run: python -m uv sync --dev --python "$UV_PYTHON"

      - name: Publish function reference to GitHub Wiki
        if: env.WIKI_TOKEN != ''
        env:
          WIKI_REMOTE: https://x-access-token:${{ env.WIKI_TOKEN }}@github.com/${{ github.repository }}.wiki.git
        run: python -m uv run --python "$UV_PYTHON" tools/publish_wiki.sh
