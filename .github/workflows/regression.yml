name: Regression

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# September 2026 temporary policy: no GitHub-hosted runner compute.
# Scheduled runs share a cancellation group so stale nightly work does not pile up.
# Manual runs use their run ID so separate on-demand release checks remain usable.
concurrency:
  group: regression-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'scheduled' }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: Compatibility (py${{ matrix.python-version }})
    runs-on: [self-hosted, linux, x64, genia]
    # 3.15 is prerelease/experimental and does not affect stable compatibility results.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Bootstrap uv for selected Python
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m uv --version
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Run non-slow compatibility tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q -vv --maxfail=1 -m "not slow" -n auto
      - name: Run semantic specs
        run: python -m uv run --python "$UV_PYTHON" python -m tools.spec_runner

  slow-tests:
    name: Slow tests (${{ matrix.section }}, py3.14)
    runs-on: [self-hosted, linux, x64, genia]
    strategy:
      fail-fast: false
      matrix:
        section: ["unit", "spec", "demo"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv for Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m uv --version
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Run slow tests
        run: python -m uv run --python "$UV_PYTHON" pytest -q -v -m "slow and not full_conformance" tests/${{ matrix.section }}/

  full-conformance:
    name: Full Python protocol conformance (py3.14)
    runs-on: [self-hosted, linux, x64, genia]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Bootstrap uv for Python 3.14
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"
          python -m uv --version
      - name: Sync dependencies
        run: python -m uv sync --dev --python "$UV_PYTHON"
      - name: Run authoritative full protocol parity proof
        run: python -m uv run --python "$UV_PYTHON" pytest -q -v -m full_conformance tests/spec/test_python_protocol_adapter_parity_762.py
