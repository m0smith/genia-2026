# Temporary smoke test for #1285.
# After approval and merge: dispatch once, record the result on #1285, then remove.
name: Issue 1285 temporary runner smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify Linux runner
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = "Linux"
          echo "Issue #1285 runner smoke test passed."
