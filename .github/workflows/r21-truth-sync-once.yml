name: R21 truth sync once

on:
  push:
    branches:
      - truth-sync-r21-cpp-number

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truth-sync-r21-cpp-number
          fetch-depth: 0

      - name: Apply exact release-number truth sync
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "GENIA_STATE.md": [
                  (
                      "production C++ implementation is R20, entirely in that repository.",
                      "production C++ implementation is R21, entirely in that repository.",
                  ),
              ],
              "hosts/cpp/AGENTS.md": [
                  (
                      "C++ implementation is R20, entirely in that repository",
                      "C++ implementation is R21, entirely in that repository",
                  ),
              ],
              "hosts/cpp/README.md": [
                  (
                      "C++ lexer/parser/evaluator bring-up is R20",
                      "C++ lexer/parser/evaluator bring-up is R21",
                  ),
              ],
              "docs/host-interop/HOST_PORTING_GUIDE.md": [
                  (
                      "implementation work is R20, entirely in that repository.",
                      "implementation work is R21, entirely in that repository.",
                  ),
              ],
              "docs/strategy/roadmap/multi-host-conformance-policy.md": [
                  (
                      "landing in R20 (`docs/strategy/roadmap/r16-r20.md`)",
                      "landing in R21 (`docs/strategy/roadmap/r16-r20.md`)",
                  ),
              ],
              "docs/releases/R16.md": [
                  (
                      "production interpreter exists yet. That is R20.",
                      "production interpreter exists yet. That is R21.",
                  ),
              ],
              "docs/design/r17-numeric-ordered-map-portability-contract.md": [
                  ("Any C++ host implementation (R20).", "Any C++ host implementation (R21)."),
                  (
                      "Float, Unicode-string, or diagnostic-message portability (R18).",
                      "Float, Unicode-string, or diagnostic-message portability (R19).",
                  ),
                  (
                      "Open functions / extensible pattern dispatch (R19).",
                      "Open functions / extensible pattern dispatch (R20).",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f"expected exactly one occurrence in {filename}: {old!r}; found {count}"
                      )
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Verify current roadmap numbering
        shell: bash
        run: |
          grep -Fq '| R20 | Open Functions and Extensible Pattern Dispatch |' docs/strategy/release-roadmap.md
          grep -Fq '| R21 | C++ Minimal Conforming Host |' docs/strategy/release-roadmap.md
          grep -Fq 'production C++ implementation is R21' GENIA_STATE.md
          ! grep -Fq 'production C++ implementation is R20' GENIA_STATE.md
          ! grep -Fq 'C++ implementation is R20, entirely in that repository' hosts/cpp/AGENTS.md
          ! grep -Fq 'C++ lexer/parser/evaluator bring-up is R20' hosts/cpp/README.md
          ! grep -Fq 'implementation work is R20, entirely in that repository.' docs/host-interop/HOST_PORTING_GUIDE.md

      - name: Commit truth sync and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r21-truth-sync-once.yml
          git add GENIA_STATE.md \
                  hosts/cpp/AGENTS.md \
                  hosts/cpp/README.md \
                  docs/host-interop/HOST_PORTING_GUIDE.md \
                  docs/strategy/roadmap/multi-host-conformance-policy.md \
                  docs/releases/R16.md \
                  docs/design/r17-numeric-ordered-map-portability-contract.md
          git commit -m "docs: align C++ host references with R21"
          git push origin HEAD:truth-sync-r21-cpp-number
