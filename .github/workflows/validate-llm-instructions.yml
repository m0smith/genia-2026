name: Validate LLM instructions

on:
  pull_request:
  push:
    branches: [main]

# September 2026 temporary policy: no GitHub-hosted runner compute.
# Fork PRs intentionally skip validation until reviewed and run from a trusted branch.
jobs:
  validate-llm-instructions:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, genia]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Validate LLM instruction sync
        run: python tools/validate_llm_instructions.py
