name: R21 truth sync follow-up

on:
  push:
    branches:
      - truth-sync-r21-cpp-number

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truth-sync-r21-cpp-number
          fetch-depth: 0

      - name: Apply exact roadmap-number corrections
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "docs/strategy/roadmap/parking-lot.md": [
                  ("open functions / extensible pattern dispatch — **promoted to planned R19**", "open functions / extensible pattern dispatch — **promoted to planned R20**"),
                  ("R19 now owns the local repeated-clause", "R20 now owns the local repeated-clause"),
                  ("promoted invariants retained by R19:", "promoted invariants retained by R20:"),
                  ("stays separate from R19 unless", "stays separate from R20 unless"),
                  ("until the R19 contract/design gates", "until the R20 contract/design gates"),
                  ("open-function semantics are promoted to R19 before the first second-host implementation", "open-function semantics are promoted to R20 before the first second-host implementation"),
                  ("C++ host implementation is promoted to R20–R23", "C++ host implementation is promoted to R21–R24"),
              ],
              "docs/strategy/cpp-host-release-plan-r16-r22.md": [
                  ("current R19 is Open Functions and\nExtensible Pattern Dispatch", "current R20 is Open Functions and\nExtensible Pattern Dispatch"),
                  ("current R20 is the first C++ host release", "current R21 is the first C++ host release"),
              ],
              "docs/strategy/cpp-host-tickets-r16-r22.md": [
                  ("current R19 is Open Functions and\nExtensible Pattern Dispatch", "current R20 is Open Functions and\nExtensible Pattern Dispatch"),
                  ("current R20 is the first C++ host release", "current R21 is the first C++ host release"),
              ],
              "docs/analysis/cpp-host-porting-readiness.md": [
                  (
                      "The remaining\n\"Technical decisions C++ will force immediately\" below (integer semantics,\nordered-map representation, Unicode/float formatting, memory/lifecycle\nmodel, error-text portability) are **not yet resolved** — those are R17\nthrough R20 (`docs/strategy/roadmap/r16-r20.md`), not R16.",
                      "The remaining\n\"Technical decisions C++ will force immediately\" below were later split\nacross the portability releases and C++ roadmap: R17 resolved integer and\nordered-map semantics, R18 resolved portable equality, R19 owns Unicode/float/\ndiagnostic portability, R20 owns Open Functions, and R21 begins the C++ host.\nConsult `docs/strategy/roadmap/r16-r20.md` for current sequencing rather than\ntreating the historical statuses below as current.",
                  ),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one occurrence in {filename}: {old!r}; found {count}")
                  text = text.replace(old, new)
              path.write_text(text)

      - name: Verify current numbering statements
        shell: bash
        run: |
          grep -Fq 'open functions / extensible pattern dispatch — **promoted to planned R20**' docs/strategy/roadmap/parking-lot.md
          grep -Fq 'C++ host implementation is promoted to R21–R24' docs/strategy/roadmap/parking-lot.md
          grep -Fq 'current R21 is the first C++ host release' docs/strategy/cpp-host-release-plan-r16-r22.md
          grep -Fq 'current R21 is the first C++ host release' docs/strategy/cpp-host-tickets-r16-r22.md
          grep -Fq 'R21 begins the C++ host' docs/analysis/cpp-host-porting-readiness.md

      - name: Commit truth sync and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r21-truth-sync-followup.yml
          git add docs/strategy/roadmap/parking-lot.md \
                  docs/strategy/cpp-host-release-plan-r16-r22.md \
                  docs/strategy/cpp-host-tickets-r16-r22.md \
                  docs/analysis/cpp-host-porting-readiness.md
          git commit -m "docs: align remaining C++ roadmap references"
          git push origin HEAD:truth-sync-r21-cpp-number
