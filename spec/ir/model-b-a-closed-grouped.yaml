              name: y
          result:
            node: IrVar
            name: y
        - node: IrCaseClause
          pattern:
            node: IrPatTuple
            items:
            - node: IrPatWildcard
          result:
            node: IrLiteral
            value: fallback
requires:
- ast_lowering
