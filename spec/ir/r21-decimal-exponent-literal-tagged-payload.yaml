name: r21-decimal-exponent-literal-tagged-payload
category: ir
description: R21 exponent-only Decimal source lowers to IrLiteral with a canonical coefficient/exponent payload
input:
  source: "1e3"
expected:
  ir:
    - node: IrExprStmt
      expr:
        node: IrLiteral
        value:
          kind: decimal
          coefficient: "1"
          exponent: "3"
