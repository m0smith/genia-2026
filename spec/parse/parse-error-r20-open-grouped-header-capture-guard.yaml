name: parse-error-r20-open-grouped-header-capture-guard
category: parse
description: R20 contract 3.3 an arm guard referencing a header name its pattern does not bind is rejected
input:
  source: |
    open g(a) = (n) ? n > a -> n | (n) -> 0
expected:
  parse:
    kind: error
    type: SyntaxError
    message: "open-function-header-capture: 'a' is a header name of 'g' and is not bound in this clause"

requires:
  - open_functions
