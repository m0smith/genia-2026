name: flow-take-single-use-error
category: flow
description: a bounded Flow is still single-use
requires: [flow_phase_1]
input:
  source: |
    x = stdin |> lines |> take(1)
    x |> collect
    x |> collect
  stdin: "a\nb\n"
expected:
  stdout: ""
  stderr: "Error: pipeline stage 1 failed in Explicit bridge mode at collect [<command>:3]: stage received flow; Flow has already been consumed\n"
  exit_code: 1
