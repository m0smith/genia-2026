name: protected-secret-flow-transport
category: flow
description: Flow transport preserves protected leaves without deriving taint
input:
  source: |
    provider = config_provider([{kind: quote(values), values: {TOKEN: "PAYLOAD_SENTINEL_591"}}]) |> unwrap_or(none)
    token = secret_get(provider, "TOKEN", quote(outbound)) |> unwrap_or(none)
    transported = [token] |> each((value) -> value) |> collect |> first |> unwrap_or(none)
    [transported == token, display(transported)]
expected:
  stdout: "[true, \"<protected>\"]\n"
  stderr: ""
  exit_code: 0

