name: chunk-zero-result-flow
category: flow
description: Valid documents compose through Flow with zero chunks as some empty list
input:
  source: |
    [
      {id: "empty", text: "", meta: represent("json", {})},
      {id: "non-empty", text: "abc", meta: represent("json", {})}
    ]
      |> flow
      |> map((doc) -> chunk((_text) -> [], doc))
      |> collect
expected:
  stdout: "[some([]), some([])]\n"
  stderr: ""
  exit_code: 0
