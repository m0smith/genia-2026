name: json-representation-encode
category: eval
description: JSON encoding accepts represented or ordinary values and emits deterministic text
input:
  source: |
    value = {z: [3, 2, 1], a: "é"}
    expected = "{\n  \"a\": \"é\",\n  \"z\": [\n    3,\n    2,\n    1\n  ]\n}"
    [
      unwrap_or("", json_encode(value)) == expected,
      unwrap_or("", json_encode(represent(quote(json), value))) == expected,
      unwrap_or({}, json_decode(unwrap_or("", json_encode(value))))
        |> representation_match(quote(json))
        |> unwrap_or({}) == value
    ]
expected:
  stdout: "[true, true, true]\n"
  stderr: ""
  exit_code: 0
