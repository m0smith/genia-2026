name: protected-secret-acquisition-and-matching
category: eval
description: >-
  Secret acquisition and matching retain the protected subject, and protected
  equality observes carrier identity only
input:
  source: |
    pattern Secret(value) = protected_match("secret", value)
    extract(value) = Secret(bound) -> display(bound) | _ -> "miss"
    provider = config_provider([{kind: quote(values), values: {TOKEN: "PAYLOAD_SENTINEL_591", EMPTY: ""}}]) |> unwrap_or(none)
    first = secret_get(provider, "TOKEN", quote(outbound)) |> unwrap_or(none)
    same = secret_get(provider, "TOKEN", quote(outbound)) |> unwrap_or(none)
    [
      extract(first),
      first == same,
      first == "PAYLOAD_SENTINEL_591",
      secret_get(provider, "EMPTY", quote(outbound)) |> protected_match("secret") |> some?,
      secret_get(provider, "MISSING", quote(outbound))
    ]
expected:
  stdout: "[\"<protected>\", false, false, true, none(\"config-missing\")]\n"
  stderr: ""
  exit_code: 0
notes: |
  updated_by_issue: 793
  release: R18
  contract: docs/design/r18-portable-value-equality-contract.md "Protected carriers"
  change: >-
    `first == same` moved from true to false. `first` and `same` are two
    independent secret_get acquisitions, so they are two distinct carriers.
    Under R18 protected equality observes carrier identity only, and
    independently acquired carriers are unequal even when they come from the
    same provider and purpose and carry equal payloads.

    The previous `true` came from comparing the carried payloads, which made
    ordinary `==` a protected-payload oracle: unprivileged code could test
    whether two secrets matched. Everything else this case proves is unchanged —
    the subject stays protected through matching, a carrier is never equal to its
    payload, empty secrets are still protected, and a missing key still yields
    none("config-missing").

