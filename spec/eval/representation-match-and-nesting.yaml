name: representation-match-and-nesting
category: eval
description: Representation matchers consume exactly one ordered outer facet and compose through named patterns
input:
  source: |
    pattern Source(value) = representation_match("source", value)
    pattern Json(value) = representation_match("json", value)
    extract(value) =
      Source(Json({id})) -> id |
      _ -> 0
    represented = represent("source", represent("json", {id: 7}))
    [
      extract(represented),
      representation_match("json", represented),
      representation_match("source", represented)
    ]
expected:
  stdout: "[7, none(\"representation-mismatch\"), some(<represented>)]\n"
  stderr: ""
  exit_code: 0
