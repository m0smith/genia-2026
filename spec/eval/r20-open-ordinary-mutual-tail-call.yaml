name: r20-open-ordinary-mutual-tail-call
category: eval
description: R20 contract 5.1 mutual tail recursion between an open interface and an ordinary function runs in constant stack space
input:
  source: |
    open count(0) = "done"
    count(n) = step(n - 1)

    step(n) = count(n)

    count(20000)
expected:
  stdout: "\"done\"\n"
  stderr: ""
  exit_code: 0

requires:
  - open_functions
