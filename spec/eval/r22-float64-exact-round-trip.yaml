name: r22-float64-exact-round-trip
category: eval
description: >-
  R22 E22-5 explicit Float64 conversions (docs/design/r22-exact-numeric-runtime-contract.md
  sections 4 and 5): float64(...) converts an exact numeric value to
  IEEE-754 binary64, and exact(...) recovers the exact mathematical value a
  finite Float64 represents -- reproducing the contract's own worked
  example for 0.1, not merely a round-tripping decimal spelling.
input:
  source: |
    [float64(2), float64(rational(1, 3)), exact(float64(0.1))]
expected:
  stdout: "[float64(2.0), float64(0.3333333333333333), 0.1000000000000000055511151231257827021181583404541015625]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 891
  release: R22
  contract: docs/design/r22-exact-numeric-runtime-contract.md "sections 4, 5"
  r23_note: >-
    "float64(...)" is the R23 E23-1 (issue #911) canonical Float64 display
    atom (docs/design/r23-numeric-representation-interchange-contract.md
    section 2.4). The third element, `exact(float64(0.1))`, is a
    GeniaDecimal (not Float64) recovering the exact dyadic value 0.1's
    binary64 bits represent, so it is unaffected and stays unwrapped.
