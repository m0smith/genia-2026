name: representation-transport-and-derivation
category: eval
description: Calls collections and pipelines transport represented values while callbacks derive only explicit results
input:
  source: |
    identity(x) = x
    represented = represent("source", 7)
    transported = represented |> identity
    stored = [transported, {item: transported}]
    derived = [represented] |> map((x) -> strip_representation("source", x) + 1)
    [stored / 0 == represented, stored / 1 / item == represented, derived]
expected:
  stdout: "[true, true, [8]]\n"
  stderr: ""
  exit_code: 0
