name: secret-qualified-view
category: eval
description: Qualified secret views preserve exact R10 protection and missing Outcomes
input:
  source: |
    provider = config_provider([{
      kind: quote(values),
      values: {OPENAI_API_KEY: "fixture", OPENAI_EMPTY: ""}
    }]) |> unwrap_or(none)
    openai = secret_view(provider, "OPENAI_", quote(model_call))
    [
      openai("API_KEY") |> protected_match("secret") |> some?,
      openai("EMPTY") |> protected_match("secret") |> some?,
      openai("MISSING")
    ]
expected:
  stdout: "[true, true, none(\"config-missing\")]\n"
  stderr: ""
  exit_code: 0
