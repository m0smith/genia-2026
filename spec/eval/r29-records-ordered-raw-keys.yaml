name: r29-records-ordered-raw-keys
category: eval
requires: [sheet_values]
description: R29 T1 approved Sheet record boundary and existing-composition evidence.
input:
  source: |
    s = sheet([[1, ["a", "b"]], [true, ["c", "d"]], ["1", ["e", "f"]], [[1, 2], ["g", "h"]], [quote(sym), ["i", "j"]], [1.5, ["k", "l"]], [rational(1, 3), ["m", "n"]], [float64(0.5), ["o", "p"]]])
    rs = sheet_records(s)
    [map_keys(unwrap_or(nil, nth(0, rs))) == columns(s), map_values(unwrap_or(nil, nth(0, rs))) == ["a", "c", "e", "g", "i", "k", "m", "o"], map_values(unwrap_or(nil, nth(1, rs))) == ["b", "d", "f", "h", "j", "l", "n", "p"], collect_sheet(rs) == s]
expected:
  stdout: "[true, true, true, true]\n"
  stderr: ""
  exit_code: 0
