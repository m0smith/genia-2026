name: template-accumulate-refinement-leaf
category: eval
description: accumulate over a bare refinement Template performs one leaf check
input:
  source: |
    Positive = refinement((x) -> x > 0)
    [accumulate(Positive, 5), accumulate(Positive, -1)]
expected:
  stdout: "[some(5), err(accumulated-validation-failed, {diagnostics: [{path: [], kind: mismatch, reason: \"refinement-mismatch\"}]})]\n"
  stderr: ""
  exit_code: 0
