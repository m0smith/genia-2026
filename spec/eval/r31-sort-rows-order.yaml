name: r31-sort-rows-order
category: eval
requires: [sheet_values, sheet_relational]
input:
  source: |
    s = collect_sheet([{region: "west", total: 8.3, manager: "Ng"}, {region: "east", total: 10.0, manager: "Okafor"}, {region: "east", total: 10.0, manager: "Park"}])
    by_total_desc = (a, b) -> row_get(a, "total") > row_get(b, "total")
    [render_csv(s |> sort_rows(by_total_desc)), render_csv(s)]
expected:
  stdout: "[\"region,total,manager\\neast,10.0,Okafor\\neast,10.0,Park\\nwest,8.3,Ng\\n\", \"region,total,manager\\nwest,8.3,Ng\\neast,10.0,Okafor\\neast,10.0,Park\\n\"]\n"
  stderr: ""
  exit_code: 0
