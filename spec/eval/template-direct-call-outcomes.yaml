name: template-direct-call-outcomes
category: eval
description: A named template is directly callable and returns its matcher Outcome unchanged
input:
  source: |
    pattern Shift(n) = some(n + 1, {source: n})
    pattern Miss(n) = none("not-selected", {source: n})
    pattern Fail(n) = err("invalid", {source: n})
    [Shift(2), Miss(2), Fail(2)]
expected:
  stdout: "[some(3, {source: 2}), none(\"not-selected\", {source: 2}), err(\"invalid\", {source: 2})]\n"
  stderr: ""
  exit_code: 0
