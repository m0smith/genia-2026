name: model-b-closed-name-collision-import
id: model-b-closed-name-collision-import
category: eval
description: "An import alias blocks a closed declaration before its annotation effect."
requires:
  - closed_functions
  - multi_file_eval
input:
  modules:
    entry: main.genia
    files:
      - path: lib.genia
        source: |
          print("loaded")
          v = 1
      - path: main.genia
        source: |
          import lib
          @meta ({m: print("sentinel")})
          lib(x) =: x
expected:
  stdout: |
    loaded
  stderr: |
    Error: Cannot declare immutable binding lib: name is already bound in this scope
  exit_code: 1
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
