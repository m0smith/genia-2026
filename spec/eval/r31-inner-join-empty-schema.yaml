name: r31-inner-join-empty-schema
category: eval
requires: [sheet_values, sheet_relational]
input:
  source: |
    left = sheet([["id", [1]], ["a", ["x"]]])
    right = sheet([["key", [1]], ["b", ["y"]]])
    empty_left = sheet([["id", []], ["a", []]])
    empty_right = sheet([["key", []], ["b", []]])
    l = inner_join("id", "key", right, empty_left)
    r = inner_join("id", "key", empty_right, left)
    [columns(l), rows(l), columns(r), rows(r), rows(left), rows(right)]
expected:
  stdout: "[[\"id\", \"a\", \"b\"], [], [\"id\", \"a\", \"b\"], [], [[[\"id\", 1], [\"a\", \"x\"]]], [[[\"key\", 1], [\"b\", \"y\"]]]]\n"
  stderr: ""
  exit_code: 0
