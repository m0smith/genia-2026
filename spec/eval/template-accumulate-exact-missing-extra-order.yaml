name: template-accumulate-exact-missing-extra-order
category: eval
description: accumulate over exact_shape orders missing-field diagnostics before extra-field diagnostics before per-field validation diagnostics
input:
  source: |
    Person = exact_shape({name: refinement((x) -> x != ""), age: refinement((x) -> x >= 0)})
    accumulate(Person, {age: -1, extra: 1})
expected:
  stdout: "err(accumulated-validation-failed, {diagnostics: [{path: [\"name\"], kind: mismatch, reason: \"accumulate-missing-field\"}, {path: [\"extra\"], kind: mismatch, reason: \"accumulate-extra-field\"}, {path: [\"age\"], kind: mismatch, reason: \"refinement-mismatch\"}]})\n"
  stderr: ""
  exit_code: 0
