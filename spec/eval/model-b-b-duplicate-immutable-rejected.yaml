name: model-b-b-duplicate-immutable-rejected
category: eval
description: "A second declaration in the same scope is rejected before its initializer."
input:
  source: |
    x =: 1
    x =: print("init")
expected:
  stdout: ""
  stderr: "Error: Cannot declare immutable binding x: name is already bound in this scope\n"
  exit_code: 1
requires:
  - immutable_bindings
