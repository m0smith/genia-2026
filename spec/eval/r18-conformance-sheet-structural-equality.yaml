name: r18-conformance-sheet-structural-equality
category: eval
description: >-
  R18 conformance: Sheets compare by ordered semantic columns and cell values,
  with the exact integer/float bridge applying to cells. Column order
  participates in equality, so reordering columns yields an unequal Sheet.
  Detects a host that compares Sheets by runtime identity or that treats columns
  as an unordered set.
input:
  source: |
    s1 = sheet([["a", [1, 2]], ["b", [3, 4]]])
    s2 = sheet([["a", [1, 2.0]], ["b", [3, 4]]])
    s3 = sheet([["b", [3, 4]], ["a", [1, 2]]])
    s4 = sheet([["a", [1, 9]], ["b", [3, 4]]])
    s5 = sheet([["a", [1, 2]]])
    [s1 == s1, s1 == s2, s1 == s3, s1 == s4, s1 == s5, s1 == [[1, 2], [3, 4]]]
expected:
  stdout: "[true, true, false, false, false, false]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 795
  release: R18
  contract: docs/design/r18-portable-value-equality-contract.md "RNG, Format, bytes, ZIP entries, Sheets, inert data descriptors"
  note: >-
    s1 == s2 is true because the cell values 2 and 2.0 are Genia-equal, which is
    the structural relation recursing into cells rather than comparing them by
    host representation.
