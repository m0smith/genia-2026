name: refinement-template-outcomes
category: eval
description: Refinement Templates lift boolean predicates while preserving the original subject
input:
  source: |
    pattern Adult(value) = refinement_match((age) -> age >= 18, value)
    [Adult(21), Adult(17)]
expected:
  stdout: "[some(21), none(\"refinement-mismatch\")]\n"
  stderr: ""
  exit_code: 0
