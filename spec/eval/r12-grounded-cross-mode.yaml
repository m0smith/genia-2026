name: r12-grounded-cross-mode
category: eval
description: Explicit R12 fixture embedding remains an ordinary authorized call
input:
  fixtures: [r12_grounded]
  source: |
    e = embed(embed_provider_fixture, {id: "e", space: "fixture-space-v1", timeout_ms: 1000}, embed_credential_fixture, embed_authority_fixture)
    e({kind: quote(query), text: "Who?"})
expected:
  stdout: "some({text: \"Who?\", embedding: {vector: [float64(1.0), float64(0.0)], dims: 2, space: \"fixture-space-v1\"}})\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 649
  classification: Experimental cross-mode proof over existing E12-2 behavior.
  r23_note: >-
    "float64(1.0)"/"float64(0.0)" are the R23 E23-1 (issue #911) canonical
    Float64 display atom (docs/design/r23-numeric-representation-interchange-contract.md
    section 2.4); the embedding vector components are host binary64 values.
