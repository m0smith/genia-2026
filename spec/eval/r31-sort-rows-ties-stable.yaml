name: r31-sort-rows-ties-stable
category: eval
requires: [sheet_values, sheet_relational]
input:
  source: |
    s = sheet([["id", [2, 1, 3, 2, 1, 3]], ["label", ["a", "b", "c", "d", "e", "f"]]])
    before = (a, b) -> row_get(a, "id") < row_get(b, "id")
    [column("label", s |> sort_rows(before)), column("label", s)]
expected:
  stdout: "[[\"b\", \"e\", \"a\", \"d\", \"c\", \"f\"], [\"a\", \"b\", \"c\", \"d\", \"e\", \"f\"]]\n"
  stderr: ""
  exit_code: 0
