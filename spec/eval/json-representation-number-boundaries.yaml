name: json-representation-number-boundaries
category: eval
description: JSON uses safe integers and finite binary64 fractional numbers
input:
  source: |
    low = unwrap_or(0, json_decode("-9007199254740991")) |> representation_match("json") |> unwrap_or(0)
    high = unwrap_or(0, json_decode("9007199254740991")) |> representation_match("json") |> unwrap_or(0)
    fraction = unwrap_or(0, json_decode("1.5")) |> representation_match("json") |> unwrap_or(0)
    [low, high, fraction]
expected:
  stdout: "[-9007199254740991, 9007199254740991, float64(1.5)]\n"
  stderr: ""
  exit_code: 0
notes: |
  r23_note: >-
    "float64(1.5)" is the R23 E23-1 (issue #911) canonical Float64 display
    atom (docs/design/r23-numeric-representation-interchange-contract.md
    section 2.4). This case does not itself assert anything about the R23
    JSON boundary (E23-3/E23-4), only that json_decode's current fraction
    result -- whatever numeric kind it is -- renders through the canonical
    renderer.
