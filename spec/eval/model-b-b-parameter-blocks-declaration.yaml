name: model-b-b-parameter-blocks-declaration
category: eval
description: "A parameter in the same frame blocks a fresh immutable declaration."
input:
  source: |
    f(x) = {
      x =: 2
      x
    }
    f(1)
expected:
  stdout: ""
  stderr: "Error: Cannot declare immutable binding x: name is already bound in this scope\n"
  exit_code: 1
requires:
  - immutable_bindings
