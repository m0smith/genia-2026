name: r18-equality-structural-contents
category: eval
description: >-
  R18 portable value equality: structural values compare recursively by semantic
  contents, not by runtime allocation identity. Two independently constructed byte
  values with the same bytes are equal, and structural recursion applies the same
  relation to nested elements including the exact integer/float bridge.
input:
  source: |
    a = utf8_encode("hi")
    b = utf8_encode("hi")
    c = utf8_encode("no")
    [a == b, a == c, [a] == [b], some(a) == some(b), [1, [2, 3]] == [1, [2, 3.0]], [1, 2] == [1, 2, 3], [] == [], some([1]) == some([1])]
expected:
  stdout: "[true, false, true, true, true, false, true, true]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 791
  release: R18
  contract: docs/design/r18-portable-value-equality-contract.md "Structural values"
  note: >-
    Before R18 the Python reference host compared byte values by allocation
    identity because GeniaBytes defined no host equality, so two equal byte
    values compared unequal.
