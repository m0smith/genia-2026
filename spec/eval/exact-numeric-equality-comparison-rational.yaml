name: exact-numeric-equality-comparison-rational
category: eval
description: >-
  Exact numeric model (issue #838 step 4): a Rational produced by
  Integer/Integer division participates in the one Genia equality relation
  and the ordered comparison operators by mathematical value, and two
  independently produced Rationals with the same reduced value compare equal
  even though they are distinct runtime objects.
input:
  source: |
    a = 1 / 3
    b = 2 / 6
    c = 1 / 2
    [a == b, a == c, a < c, c < a, a <= a, c >= a, 1 == 2 / 2, 2 / 2 == 1]
expected:
  stdout: "[true, false, true, false, true, true, true, true]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 838
  release: none (pre-release follow-on step for a future R21 gate)
  contract: >-
    docs/design/exact-numeric-model-contract.md section 10.1 "Exact family":
    Integer, Decimal, and Rational compare by mathematical value for
    `==`/`!=`/`<`/`<=`/`>`/`>=`, and "1 == rational(2, 2)" after
    canonicalization.
  note: >-
    Decimal and Float64 are not yet reachable from Genia source (no
    conversion builtins land until a later step), so this case only exercises
    the source-reachable Rational family produced by Integer/Integer
    division; Decimal/Float64 cross-kind equality/comparison is covered by
    tests/unit/test_numeric_equality_comparison.py against the runtime value
    model directly.
