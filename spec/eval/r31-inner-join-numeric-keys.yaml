name: r31-inner-join-numeric-keys
category: eval
requires: [sheet_values, sheet_relational]
input:
  source: |
    left = sheet([["id", [1, 1/2]], ["a", ["a", "b"]]])
    right = sheet([["id", [1.0, float64(1.0), 0.5, float64(0.5)]], ["b", ["w", "x", "y", "z"]]])
    out = inner_join("id", "id", right, left)
    [column("id", out), column("b", out), column("id", left)]
expected:
  stdout: "[[1, 1, 1/2, 1/2], [\"w\", \"x\", \"y\", \"z\"], [1, 1/2]]\n"
  stderr: ""
  exit_code: 0
