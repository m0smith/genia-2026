name: r22-exact-family-and-float64-ordering
category: eval
description: >-
  R22 E22-7 mathematical ordering (docs/design/r22-exact-numeric-runtime-contract.md
  section 10.1, 10.2): <, <=, >, >= across Integer/Decimal/Rational, plus
  the explicit Float64 bridge, which compares by the float's own exact
  represented value rather than rounding the exact operand to Float64.
input:
  source: |
    [1 < rational(3, 2), rational(1, 2) <= rational(1, 2), rational(2, 3) > rational(1, 2), 1.5 >= 1, float64(1) < 2, rational(1, 2) < float64(1)]
expected:
  stdout: "[true, true, true, true, true, true]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 893
  release: R22
  contract: docs/design/r22-exact-numeric-runtime-contract.md "section 10.1, 10.2"
