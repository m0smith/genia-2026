name: r22-exact-arithmetic-promotion-lattice
category: eval
description: >-
  R22 E22-3 exact-family +, -, * promotion lattice (Integer < Decimal <
  Rational): Integer/Integer stays Integer, Decimal participation stays
  Decimal even for an integral result, and any Rational participation
  produces Rational (reduced, collapsing to Integer at denominator 1).
input:
  source: |
    [1 + 2, 1.5 + 0.5, rational(1, 2) + rational(1, 3), rational(1, 2) + rational(1, 2), 1 + rational(1, 2), -rational(1, 2)]
expected:
  stdout: "[3, 2.0, 5/6, 1, 3/2, -1/2]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 887, 888, 889
  release: R22
  contract: docs/design/r22-exact-numeric-runtime-contract.md "section 6"
  r23_note: >-
    "2.0" for 1.5+0.5 reflects that the Decimal result stays Decimal kind
    (not Integer) even though the value is integral; the `.0` suffix is
    R23 E23-1's (issue #911) canonical Decimal display atom
    (docs/design/r23-numeric-representation-interchange-contract.md section
    2.2), required precisely so an integral Decimal remains visibly
    distinct from Integer. "5/6" / "3/2" / "-1/2" are likewise the
    canonical Rational display atom (section 2.3).
