name: r18-equality-nan-non-reflexive
category: eval
description: >-
  R18 portable value equality: NaN is unequal to everything including itself, and
  that non-reflexivity propagates through structural containers. A conforming host
  must not shortcut structural comparison by first testing container-element
  identity, which would wrongly report a NaN-bearing value equal to itself.
input:
  source: |
    big = float64(1e308)
    pinf = big * big
    nan = pinf - pinf
    [nan == nan, nan == 0.0, nan == pinf, [nan] == [nan], some(nan) == some(nan), err("e", nan) == err("e", nan), [1, nan] == [1, nan], [1, 2] == [1, 2]]
expected:
  stdout: "[false, false, false, false, false, false, false, true]\n"
  stderr: ""
  exit_code: 0
notes: |
  issue: 791
  release: R18
  contract: docs/design/r18-portable-value-equality-contract.md "Numeric equality"
  note: >-
    Before R18 the Python reference host reported [nan] == [nan] and
    some(nan) == some(nan) as true because host list and dataclass comparison
    test element identity before element equality.
  note_840: >-
    Issue #840 retired the decimal-literal Float64 bridge: decimal-classified
    source literals now materialize as exact, arbitrary-precision Decimal
    that never silently overflows, so the previous "absurdly large decimal
    literal" trick for reaching Float64 +infinity/NaN no longer produces
    infinity at all -- exact arithmetic never implicitly produces Float64
    (contract section 7). NaN is now constructed via explicit Float64
    arithmetic overflow instead (`float64(1e308) * float64(1e308)` overflows
    to Float64 +infinity per ordinary IEEE-754 binary64 semantics, then
    infinity minus itself is NaN), which is within the numeric contract's
    Float64 domain (docs/design/exact-numeric-model-contract.md section 9)
    and does not require a public NaN literal/constructor.
