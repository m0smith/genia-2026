name: error-secret-view-invalid-logical-name
category: error
description: Secret view logical-name misuse does not reveal rejected content
input:
  source: |
    provider = config_provider([]) |> unwrap_or(none)
    view = secret_view(provider, "SECRET_PREFIX_SENTINEL_", quote(outbound))
    view("LOGICAL_SENTINEL\u0000HIDDEN")
expected:
  stdout: ""
  stderr: "Error: secret_view expected a non-empty logical name string without NUL, received string\n"
  exit_code: 1
