name: r18-map-key-nested-nan-rejected
category: error
description: >-
  R18 portable value equality: an otherwise-legal structural key that contains
  NaN in an equality-relevant position is itself not reflexive, so it is not a
  legal map key either. Rejection applies at any depth.
input:
  source: |
    nan = __r18_conformance_test_only_nan
    map_put(map_new(), [1, [2, nan]], "value")
expected:
  stdout: ""
  stderr: "Error: map key must equal itself; NaN is not a legal map key\n"
  exit_code: 1
notes: |
  issue: 792
  release: R18
  error_phase: eval
  error_category: TypeError
  contract: docs/design/r18-portable-value-equality-contract.md "Legal map keys and key equivalence"
  r22_note: >-
    See r18-map-key-nan-rejected.yaml: R22 E22-1 (issue #887) closed the prior
    `big * big * big` NaN-reachability technique, so this case now uses the
    private `__r18_conformance_test_only_nan` host test seam instead.
