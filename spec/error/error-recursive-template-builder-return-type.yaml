name: error-recursive-template-builder-return-type
category: error
description: recursive_template rejects a builder that does not return a Template
input:
  source: |
    recursive_template("tree", (ref) -> 1, 5)
expected:
  stdout: ""
  stderr: "Error: recursive_template builder must return a Template, received int\n"
  exit_code: 1
notes: |
  error_phase: eval
  error_category: TypeError
