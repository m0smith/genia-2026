name: r11-validated-pipeline-structured-failure
category: error
description: Invalid structured provider text becomes one normalized existing model error
input:
  fixtures: [r11_model]
  source: |
    schema = json_decode("{\"type\":\"object\",\"properties\":{\"id\":{\"type\":\"integer\"},\"label\":{\"type\":\"string\"}},\"required\":[\"id\",\"label\"],\"additionalProperties\":false}") |> unwrap_or({})
    Output = json_schema(schema) |> unwrap_or((_) -> none("compile-failed"))
    m = model(model_provider_fixture, {id: "fixture-malformed-json", timeout_ms: 1000}, model_credential_fixture, model_authority_fixture)
    m({messages: [{role: quote(user), content: {kind: quote(text), text: "enrich"}}], output: {kind: quote(json), schema: schema, template: Output}})
expected:
  stdout: |
    err("model-structured-output-invalid", {stage: json_decode, outcome: err(invalid_json, {kind: json, operation: decode, status: error, reason: invalid_json, line: 1, column: 2})})
  stderr: ""
  exit_code: 0
