name: model-b-d1-preserve-ordinary-extension-rejection
category: error
description: Importing an ordinary module does not activate cross-module extension authority.
requires: [multi_file_eval, open_functions]
input:
  modules:
    entry: main.genia
    files:
      - {path: base.genia, source: 'f(x)=x'}
      - path: main.genia
        source: |
          import base
          extend base.f(0)=0
expected:
  stdout: ''
  stderr: "Error: open-function-target-not-open: 'base.f' is not an open function interface\n"
  exit_code: 1
notes: Existing rejection must remain; not a capability downgrade or linking implementation.
