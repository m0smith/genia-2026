name: r31-inner-join-illegal-key-function
category: error
requires: [sheet_values, sheet_relational]
input:
  source: |
    inner_join("id", "id", sheet([["id", [(x) -> x]]]), sheet([["id", [2, 1]]]))
expected:
  stdout: ""
  stderr: "Error: inner_join expected a legal key at right row 0\n"
  exit_code: 1
