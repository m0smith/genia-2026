name: r31-inner-join-illegal-key-with-empty-right
category: error
requires: [sheet_values, sheet_relational]
input:
  source: |
    inner_join("id", "id", sheet([["id", []]]), sheet([["id", [nil]]]))
expected:
  stdout: ""
  stderr: "Error: inner_join expected a legal key at left row 0\n"
  exit_code: 1
