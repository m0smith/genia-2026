name: r22-float64-magnitude-overflow-rejected
category: error
description: >-
  R22 E22-5: float64(value) fails deterministically when the exact
  magnitude exceeds the largest finite binary64 value, rather than
  silently producing infinity.
input:
  source: |
    float64()
expected:
  stdout: ""
  stderr: "Error: float64: exact magnitude exceeds the largest finite binary64 value\n"
  exit_code: 1
notes: |
  issue: 891
  release: R22
  contract: docs/design/r22-exact-numeric-runtime-contract.md "section 4"
