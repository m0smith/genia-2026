name: model-b-closed-name-reserved-runtime
id: model-b-closed-name-reserved-runtime
category: error
description: "A runtime-owned name is rejected before any annotation effect."
requires:
  - closed_functions
input:
  source: |
    @meta ({m: print("sentinel")})
    print(x) =: x
expected:
  stdout: ''
  stderr: |
    Error: Cannot declare immutable binding print: name is reserved by the runtime
  exit_code: 1
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
