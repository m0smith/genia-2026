name: error-r20-cross-module-duplicate-alias-selection
category: error
description: R20 portable cross-module diagnostic — selecting one cached contribution twice through aliases is rejected
input:
  modules:
    entry: main.genia
    files:
      - path: base.genia
        source: |
          open get("mem", store, key) = "mem:" + key
      - path: db_ext.genia
        source: |
          import base
          extend base.get("db", db, key) = "db:" + key
      - path: cache_ext.genia
        source: |
          import base
          extend base.get("cache", c, key) = "cache:" + key
      - path: main.genia
        source: |
          import base
          import db_ext
          import db_ext as alias
          use get from base with db_ext, alias
expected:
  stdout: ''
  stderr: "Error: open-function-duplicate-selection: contribution 'db_ext' is already selected for ('base', 'get')\n"
  exit_code: 1
requires:
  - open_functions
  - multi_file_eval
