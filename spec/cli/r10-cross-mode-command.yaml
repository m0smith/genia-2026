name: r10-cross-mode-command
category: cli
description: Command mode preserves explicit provider semantics and redacts the protected final value
input:
  source: &source |
    provider = config_provider([{kind: quote(values), values: {R10_CROSS_MODE_KEY_SENTINEL_594: "R10_CROSS_MODE_PAYLOAD_SENTINEL_594"}}]) |> unwrap_or(none)
    secret_get(provider, "R10_CROSS_MODE_KEY_SENTINEL_594", quote(fixture_use)) |> unwrap_or(none)
  file: null
  command: *source
  stdin: ""
  argv: []
  debug_stdio: false
expected:
  stdout: "<protected>"
  stderr: ""
  exit_code: 0
