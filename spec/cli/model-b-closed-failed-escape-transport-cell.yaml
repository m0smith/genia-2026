name: model-b-closed-failed-escape-transport-cell
id: model-b-closed-failed-escape-transport-cell
category: cli
description: "A Cell constructed during the annotation stores the failed callable."
requires:
  - closed_functions
  - repl
  - refs
  - cell_primitives
input:
  source: |-
    h = ref(0)
    @meta ({m: ref_set(h, cell(f))}); @doc 7; f(x) =: x
    cell_get(ref_get(h))
  file: null
  command: null
  stdin: |-
    h = ref(0)
    @meta ({m: ref_set(h, cell(f))}); @doc 7; f(x) =: x
    cell_get(ref_get(h))
  argv: []
  debug_stdio: false
expected:
  stdout: |-
    <ref 0>
    <closed-function failed>
  stderr: |-
    Error: @doc annotation expected a string, received int
  exit_code: 0
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
