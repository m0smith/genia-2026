name: r11-model-fixture-command
category: cli
description: Command mode observes the explicitly injected deterministic model fixture
input:
  fixtures: [r11_model]
  source: &source |
    m = model(model_provider_fixture, {id: "fixture-text", timeout_ms: 1000}, model_credential_fixture, model_authority_fixture)
    m({messages: [{role: quote(user), content: {kind: quote(text), text: "hello"}}], output: {kind: quote(text)}})
  command: *source
  stdin: ""
  argv: []
expected:
  stdout: 'some({message: {role: assistant, content: {kind: text, text: "fixture reply"}}, finish_reason: stop, usage: some({input_tokens: 2, output_tokens: 3, total_tokens: 5})})'
  stderr: ""
  exit_code: 0
