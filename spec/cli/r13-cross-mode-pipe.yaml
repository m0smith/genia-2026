id: r13-cross-mode-pipe
name: r13-cross-mode-pipe
category: cli
description: Pipe mode requires explicit per-program R13 construction and preserves qualified lookup Outcomes
input:
  source: &source |
    map((line) -> {
      provider = config_standard({SERVER_PORT: "configured"}, []) |> unwrap_or(none)
      config_view(provider, "SERVER_")("PORT")
    }) |> each(print)
  command: *source
  stdin: "row\n"
  argv: []
  debug_stdio: false
expected:
  stdout: "some(configured)"
  stderr: ""
  exit_code: 0
notes: |
  issue: 675
  classification: Experimental pipe-mode observation over ordinary calls and existing Flow stages.
