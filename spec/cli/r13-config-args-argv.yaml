id: r13-config-args-argv
name: r13-config-args-argv
category: cli
description: File mode can explicitly adapt raw trailing argv into an R10 values descriptor
input:
  source: "config_args(argv())"
  command: "config_args(argv())"
  stdin: ""
  argv: ["--", "--server-port", "8080", "--", "input.jsonl"]
expected:
  stdout: 'some({kind: values, values: {SERVER_PORT: "8080"}})'
  stderr: ""
  exit_code: 0
