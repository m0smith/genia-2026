name: model-b-closed-failed-flow-not-pulled
id: model-b-closed-failed-flow-not-pulled
category: cli
description: "A Flow stage built from a failed callable raises nothing until pulled."
requires:
  - closed_functions
  - repl
  - refs
  - flow_phase_1
input:
  source: |-
    r = ref(0)
    @meta ({m: ref_set(r, f)}); @doc 7; f(x) =: x
    g = ref_get(r)
    s = evolve(0, (n) -> n + 1) |> map(g); 0
  file: null
  command: null
  stdin: |-
    r = ref(0)
    @meta ({m: ref_set(r, f)}); @doc 7; f(x) =: x
    g = ref_get(r)
    s = evolve(0, (n) -> n + 1) |> map(g); 0
  argv: []
  debug_stdio: false
expected:
  stdout: |-
    <ref 0>
    <closed-function failed>
    0
  stderr: |-
    Error: @doc annotation expected a string, received int
  exit_code: 0
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
