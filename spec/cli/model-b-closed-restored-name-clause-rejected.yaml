name: model-b-closed-restored-name-clause-rejected
id: model-b-closed-restored-name-clause-rejected
category: cli
description: "Restoring the name to a failed callable still rejects a clause."
requires:
  - closed_functions
  - repl
  - refs
input:
  source: |-
    r = ref(0)
    @meta ({m: ref_set(r, f)}); @doc 7; f(x) =: x
    f = ref_get(r)
    f(x, y) = y
  file: null
  command: null
  stdin: |-
    r = ref(0)
    @meta ({m: ref_set(r, f)}); @doc 7; f(x) =: x
    f = ref_get(r)
    f(x, y) = y
  argv: []
  debug_stdio: false
expected:
  stdout: |-
    <ref 0>
    <closed-function failed>
  stderr: |-
    Error: @doc annotation expected a string, received int
    Error: closed-function-not-extensible: cannot declare f/2: f refers to a closed function
  exit_code: 0
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
