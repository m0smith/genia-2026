name: model-b-closed-annotation-effect-then-value-failure
id: model-b-closed-annotation-effect-then-value-failure
category: cli
description: "A permitted annotation effect is visible; a later invalid value fails the declaration and leaves nothing."
requires:
  - closed_functions
  - repl
  - doc_help
input:
  source: |-
    @meta ({m: print("eff")}); @doc 7; f(x) =: x
    f
    meta("f")
  file: null
  command: null
  stdin: |-
    @meta ({m: print("eff")}); @doc 7; f(x) =: x
    f
    meta("f")
  argv: []
  debug_stdio: false
expected:
  stdout: |-
    eff
    none("missing-meta", {name: "f"})
  stderr: |-
    Error: @doc annotation expected a string, received int
    Error: Undefined name: f
  exit_code: 0
notes: |
  Kind: Model B Slice E2.4 future-behavior case (fails until E2.4 GREEN) unless noted in the RED evidence.
  Oracle: contract-derived from the approved Slice E design (docs/design/pre-r29-model-b-slice-e-closed-publication-design.md)
  sections 4, 5, 7 and 10.2; diagnostics that already exist for ordinary declarations were taken from the existing host.
