[pytest]
testpaths = tests
python_files = test_*.py
pythonpath =
    .
    src
    tools
    tests/doc
addopts = --strict-markers
markers = 
  spec: language/spec contract tests,
  slow: slow tests,
  integration: integration tests,
  docs: documentation validation tests
  unit: unit tests
  loopback: tests that require binding or connecting to a local loopback socket
